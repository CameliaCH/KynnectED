<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}KynnectED{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <nav class="topbar-links">
      <a href="{{ url_for('learning_resources') }}" class="nav-link">Learning Resources</a>
    </nav>
    <a href="/login" class="btn-signin">Log In</a>
    <a href="/signup" class="btn-signin">Sign Up</a>
  </header>

  {% block content %}{% endblock %}

  <footer class="site-footer">
    <a class="footer-brand" href="{{ url_for('home') }}">
      <svg class="footer-logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0c1 3.5 3.5 6 7 7-3.5 1-6 3.5-7 7-1-3.5-3.5-6-7-7 3.5-1 6-3.5 7-7z"/>
      </svg>
      KynnectED
    </a>

    <nav class="footer-nav">
      <a href="{{ url_for('contact') }}">Contact</a>
      <a href="{{ url_for('learning_resources') }}">Learning Resources</a>
      <a href="/login" class="btn-signin">Log In</a>
      <a href="/signup" class="btn-signin">Sign Up</a>
    </nav>

    <div class="footer-social">
      <a href="#" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
      <a href="#" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <rect x="2" y="9" width="4" height="12"></rect>
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
      </a>
      <a href="#" aria-label="X">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
        </svg>
      </a>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

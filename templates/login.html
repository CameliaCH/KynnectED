{% extends "base.html" %}

{% block title %}Log In &middot; KynnectED{% endblock %}
{% block body_class %}interior-page{% endblock %}

{% block content %}
  <main class="page-hero">
    <h1>Welcome back!</h1>
  </main>

  <section class="page-body">
    <form class="account-form login-form" action="/login-process" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="input-container">
        <input type="text" placeholder="Username" aria-label="Username" name="username" id="username" autocomplete="off">
      </div>
      <div class="input-container">
        <input type="password" placeholder="Password" aria-label="Password" name="password" id="password" autocomplete="off">
      </div>
      <button type="submit" class="btn-signin">Submit</button>
    </form>
    <p class="account-switch">Don't have an account? <a href="/signup">Sign Up</a></p>
  </section>
{% endblock %}

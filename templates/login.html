{% extends "base.html" %}
{% block title %}Login · KynnectED{% endblock %}
{% block body_class %}interior-page{% endblock %}
{% block content %}
<main class="auth-layout wrap">
  <section class="auth-card" aria-labelledby="login-heading">
    <h1 id="login-heading">Log in</h1>
    <p>Access your sessions, messages, and resources.</p>
    <form class="account-form login-form" action="{{ url_for('login_process') }}" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username<input type="text" placeholder="Your username" name="username" id="username" autocomplete="username" required></label>
      <label for="password">Password<input type="password" placeholder="Your password" name="password" id="password" autocomplete="current-password" required></label>
      <button type="submit" class="button">Log in</button>
    </form>
    <p class="account-switch"><a href="{{ url_for('password_reset.forgot') }}">Forgot your password?</a></p>
    <p class="account-switch">Don’t have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
    <p class="auth-help">Need help? <a href="{{ url_for('contact') }}">Contact us</a>.</p>
  </section>
</main>
{% endblock %}

<dialog id="learner-guidelines-dialog" class="mentor-conduct-dialog learner-guidelines-dialog" aria-labelledby="learner-guidelines-heading" data-version="{{ learner_guidelines_version }}">
  <div class="conduct-dialog-header">
    <h2 id="learner-guidelines-heading" tabindex="-1" autofocus>Your quick learner guide</h2>
    <button id="guidelines-close" class="conduct-close" type="button" aria-label="Close learner guide">×</button>
  </div>
  <div class="conduct-dialog-body">
    <p>Welcome! Please read these simple steps before you join.</p>
    {% with guidelines_in_dialog=true %}{% include "learner_guidelines.html" %}{% endwith %}
    <label class="conduct-checkbox" for="learner-guidelines-accepted"><input id="learner-guidelines-accepted" type="checkbox"><span>I have read this guide and agree to follow it.</span></label>
  </div>
  <div class="conduct-dialog-footer">
    <p id="guidelines-signup-error" class="form-error" role="alert" hidden></p>
    <button class="button button-outline" id="guidelines-back" type="button">Back</button>
    <button class="button" id="guidelines-confirm" type="button" disabled>Complete sign up</button>
  </div>
</dialog>
